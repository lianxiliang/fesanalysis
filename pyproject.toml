[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bivo4-fes"
version = "0.1.2"
description = "Notebook-first proton-transfer geometry, OPES reweighting, and string paths"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "MDAnalysis>=2.6", "numba>=0.59", "matplotlib>=3.7", "tqdm>=4.64"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "nbformat>=5", "nbclient>=0.8"]
test = ["pytest>=7", "nbformat>=5", "nbclient>=0.8", "ipykernel"]
ase = ["ase>=3.22"]

[project.scripts]
bivo4-fes = "bivo4_fes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
